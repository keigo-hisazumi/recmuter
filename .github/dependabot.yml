# Dependabot 設定
#
# GitHub Actions の更新を有効化しています。
# GitHub Actions の更新はまとめて 1 つの PR にし、PR タイトルは Conventional Commits 形式（chore(deps): ...）になります。
# Dependabot ではなく Renovate を使う場合は本ファイルを削除し、`renovate.json` を追加してください。

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
