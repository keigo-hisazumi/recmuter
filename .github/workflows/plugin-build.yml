# プラグインビルド CI
#
# RecMuter プラグインを各 OS でビルドし、単体テストを実行します。
#   - macOS / Windows: AAX（＋ VST3 / AU）をビルドし、成果物をアップロード
#   - Linux: AAX は非対応のため VST3 と単体テストのみ
#
# 注意: ここでビルドされる AAX は PACE 署名されていないため、
#       製品版 Pro Tools では読み込めません（Pro Tools Developer で動作確認してください）。

name: Plugin Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux 依存パッケージのインストール
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev

      - name: CMake 設定
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build
          fi

      - name: ビルド
        run: cmake --build build --config Release --parallel

      - name: 単体テスト
        run: ctest --test-dir build -C Release --output-on-failure

      - name: 成果物のアップロード
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RecMuter-${{ runner.os }}
          path: |
            build/RecMuter_artefacts/Release/AAX
            build/RecMuter_artefacts/Release/VST3
            build/RecMuter_artefacts/Release/AU
          if-no-files-found: error
